
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "food-demand-intelligence"
version = "0.1.0"
description = "Reproducible food demand forecasting and ML benchmarking"
requires-python = ">=3.11,<3.13"

dependencies = [
    "numpy",
    "pandas",
    "matplotlib",
    "scikit-learn",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"
